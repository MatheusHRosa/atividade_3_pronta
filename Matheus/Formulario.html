<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
   content="width=device-width, initial-scale=1.0">

   <link rel="stylesheet"  href="pagina.css">
  <title>Formulário</title>
  </head>
  <body>
    <header class="topo">
    
    <div class="container">
        <div class="form_box">
        
        <!--FOMULARIO-->
        <h2 align="center">Formulário</h2>
        <form action="" method="post">
            <p>Nome: <input type="text" name="Nome" placeholder="Escreva seu nome" size="60"/></p>
            <br />
            <br />
            <p>Telefone:<input type="Tel" placeholder="(00)00000-0000" maxlength="11" /></p>
            <br />
            <br />
            <p>Data de nascimento: <input type="date"/> </p>
            <br />
            <br />
            <p>Senha: <input type="password" maxlength="8" />(A senha pode ter até 8 caracteres)</p>
            <br />
            <br />
            <p>Email: <input type="email" /></p>
            <br />
            <br />
            <p>Idade: <input type="number"/></p>
            <br />
            comentarios:
            
            <textarea rows="3" cols="10">
            </textarea>
            <!--Estrutura de Opções-->
            <p>Time de futebol:
                <br />
             <input type="radio" name="time" value="Brasil"/> Brasil
             <br />
             <br />
             <input type="radio" name="time" value="Argentina"/>Argentina
             <br />
             <br />
             <input type="radio" name="time" value="Peru"/>Peru
             <br />
             <br />
            </p>
            <p> Estados Brasileiros:
                <select>
                <option value="Goias">Goias</option>
                <option value="DF">DF</option>
                <option value="Bahia">Bahia</option>
                <option value="Paraiba">Paraiba</option>
            </select>

            </p>
            <!--Estruturas de checkbox-->
            <p>
                <input type="checkbox" name="termos" />
                vc aceita fazer parte da ceita do HTML!!!
            </p>
            
        <br />
        <fieldset>
            <legend>Conte mais sobre você:</legend>
            <label>Escreva aqui:></label>
            <textarea rows="3" cols="10"></textarea>
            <br />
            <br />
           
        </fieldset>
        <br />
        <br />
            <fieldset>
                <legend>Dados pessoais</legend>
                <label>Nome: <input type="text"/></label>
                <br />
                <br />
                <label>CPF: <input type="number" /></label>
            </fieldset>
            <br />
            <br />
            <input type="reset" name=reset />
            <input type="submit" name="submit" />
        </form>
        </div>
    </div>
    </header>
  </body>
